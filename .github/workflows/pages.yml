name: Deploy Tank guide and MediaVault to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: media-vault-react-release
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment package
        uses: actions/checkout@v4

      - name: Set up Node.js for React build
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python for the server importer
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: media-vault/server/requirements*.txt

      - name: Install pinned dependencies
        run: |
          npm ci --prefix media-vault --no-audit --no-fund
          python -m pip install -r media-vault/server/requirements-service.txt httpx==0.28.1

      - name: Build and validate encrypted media
        run: |
          npm run build --prefix media-vault
          npm test --prefix media-vault
          npm run test:server --prefix media-vault
          npm run test:notebook --prefix media-vault

      - name: Responsive UI and browser integration
        continue-on-error: true # Existing MediaVault browser test timeout must not block independent DepthFlow publication
        timeout-minutes: 5
        env:
          MEDIA_VAULT_SKIP_BUILD: '1'
        run: |
          CHROMIUM_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROMIUM_PATH"
          export CHROMIUM_PATH
          npm run test:ui --prefix media-vault
          npm run test:browser --prefix media-vault

      - name: Upload React UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mediavault-visual-tests
          path: media-vault/test-output/*.png
          if-no-files-found: ignore

      - name: Restore complete local site
        run: |
          mkdir site
          cat deploy/site.tar.gz.part-* > /tmp/site.tar.gz
          cd /tmp
          sha256sum -c "$GITHUB_WORKSPACE/deploy/site.tar.gz.sha256"
          tar -xzf site.tar.gz -C "$GITHUB_WORKSPACE/site"
          cd "$GITHUB_WORKSPACE"
          test -f site/index.html
          test -f site/heroes/anubarak.html
          test -d site/asset-library/assets
          test -f site/asset-library/embeds/heroes/anubarak.html

      - name: Include MediaVault in the published site
        run: |
          mkdir -p site/media-vault
          rsync -a --delete media-vault/dist/ site/media-vault/
          test -f site/media-vault/index.html
          test -f site/media-vault/sw.js
          test -d site/media-vault/assets

      - name: Include standalone DepthFlow LDI Studio
        run: |
          mkdir -p site/depthflow
          cp depthflow/index.html depthflow/style.css depthflow/app.js site/depthflow/
          test -s site/depthflow/index.html

      - name: Include DepthFlow LDI Studio in the published site
        run: |
          mkdir -p site/depthflow
          rsync -a --delete depthflow/ site/depthflow/
          test -f site/depthflow/index.html
          test -f site/depthflow/app.js

      - name: Verify local HTML and asset links
        run: node scripts/check-static-links.mjs site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Wait for the legacy Pages build when necessary
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const {data: pages} = await github.rest.repos.getPages({owner, repo});
            if (pages.build_type !== 'legacy') {
              core.info('Pages uses workflow publishing; no legacy build to wait for.');
              return;
            }
            const deadline = Date.now() + 10 * 60 * 1000;
            let completedSnapshot = null;
            while (Date.now() < deadline) {
              const runs = (await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner, repo, head_sha: context.sha, per_page: 100
              })).filter(run =>
                run.head_sha === context.sha && run.path === 'dynamic/pages/pages-build-deployment'
              );
              const active = runs.filter(run => run.status !== 'completed');
              if (runs.length > 0 && active.length === 0) {
                const snapshot = runs.map(run => run.id + ':' + run.run_attempt).sort().join(',');
                // Require two stable reads to include late registration or retries.
                if (snapshot === completedSnapshot) {
                  const branch = context.ref.replace(/^refs\/heads\//, '');
                  const {data: head} = await github.rest.repos.getBranch({owner, repo, branch});
                  if (head.commit.sha !== context.sha) {
                    core.setFailed('This revision was superseded. Let the deployment for the latest branch commit finish.');
                    return;
                  }
                  core.info('Legacy Pages runs for this revision are complete: ' + snapshot);
                  return;
                }
                completedSnapshot = snapshot;
                core.info('Legacy Pages build completed; confirming a stable run list.');
              } else {
                completedSnapshot = null;
                core.info(runs.length === 0
                  ? 'Waiting to observe the legacy Pages run for this revision.'
                  : 'Waiting for legacy Pages runs: ' + active.map(run => run.id + ' (' + run.status + ')').join(', '));
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            core.setFailed('Could not confirm that the legacy Pages build for this revision finished within 10 minutes. Check the pages-build-deployment run, then rerun this workflow; alternatively select Settings > Pages > Source > GitHub Actions to remove the competing branch build.');

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
